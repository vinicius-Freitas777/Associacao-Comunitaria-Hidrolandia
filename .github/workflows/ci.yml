
name: CI - Portal Comunitario de Hidrolandia

on:
  push:
    branches:
      - main
      - melhoria-acessibilidade-seguranca
  pull_request:
    branches:
      - main

jobs:
  testes-automatizados:
    name: Testes automatizados
    runs-on: ubuntu-latest

    steps:
      - name: Baixar codigo do repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Executar testes e medir cobertura
        run: node --test --experimental-test-coverage tests/*.test.js
